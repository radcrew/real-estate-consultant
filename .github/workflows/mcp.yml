# Lint + unit tests for the radestate MCP adapter (services/mcp).
name: MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "services/mcp/**"
      - ".github/workflows/mcp.yml"

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest -q
