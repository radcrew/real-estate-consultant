# MCP adapter: lint/test on PR and main.
#
# Deploys are handled by the Vercel GitHub integration for project
# `real-estate-consultant-mcp` (Chris Silva's projects / team_GGqKP4vcYS6Z1tP94DfMSzaB,
# Root Directory = services/mcp). Do not use secrets.VERCEL_TOKEN here — that token
# belongs to the frontend/backend Vercel team and cannot see this MCP project
# ("Project not found").
#
# Production env in Vercel: BACKEND_API_URL (see services/mcp/.env.example).
# Do NOT set MCP_API_KEY on the shared deployment.
name: MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "services/mcp/**"
      - ".github/workflows/mcp.yml"

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest -q
