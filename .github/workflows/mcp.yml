# MCP adapter: lint/test on every change; Vercel deploy on PR (preview) and main (production).
#
# Separate Vercel project with Root Directory = services/mcp (Settings → General).
# Deploy runs from services/mcp/ (same pattern as backend/).
#
# GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID,
#                 VERCEL_AUTOMATION_BYPASS_SECRET (optional — Deployment Protection bypass)
# VERCEL_PROJECT_ID is set in-workflow to prj_dZS9H4Ne4VpVIMHiz5XaDohRxRvs (real-estate-consultant-mcp).
# Production env in Vercel: BACKEND_API_URL=https://real-estate-consultant-be.vercel.app
#   (see services/mcp/.env.example — do NOT set MCP_API_KEY on the shared deployment)
name: MCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "services/mcp/**"
      - ".github/workflows/mcp.yml"

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  # Project IDs are not sensitive. Do not use secrets.* here — an unset secret
  # makes the whole expression empty in Actions, which breaks vercel pull.
  VERCEL_PROJECT_ID: prj_dZS9H4Ne4VpVIMHiz5XaDohRxRvs

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest -q

  deploy:
    name: Deploy to Vercel
    needs: [lint-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Require Vercel project id
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing VERCEL_ORG_ID or VERCEL_PROJECT_ID. Set GitHub secret VERCEL_ORG_ID (project id is pinned in this workflow)."
            exit 1
          fi
          echo "Using VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          smoke() {
            local path="$1"
            for i in 1 2 3; do
              body=$(curl -s -w "\n%{http_code}" \
                -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
                "$BASE_URL$path")
              status=$(echo "$body" | tail -1)
              [ "$status" = "200" ] && { echo "OK $path"; return 0; }
              [ $i -lt 3 ] && sleep 5
            done
            echo "FAIL $path — status $status — body:"
            echo "$body" | head -5
            exit 1
          }
          smoke /health

  deploy-preview:
    name: Deploy preview to Vercel
    needs: [lint-and-test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Require Vercel project id
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing VERCEL_ORG_ID or VERCEL_PROJECT_ID. Set GitHub secret VERCEL_ORG_ID (project id is pinned in this workflow)."
            exit 1
          fi
          echo "Using VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BYPASS_SECRET" ]; then
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set — requests may be blocked by Vercel protection (401)."
          fi
          smoke() {
            local path="$1"
            for i in 1 2 3; do
              body=$(curl -s -w "\n%{http_code}" \
                -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
                "$BASE_URL$path")
              status=$(echo "$body" | tail -1)
              [ "$status" = "200" ] && { echo "OK $path"; return 0; }
              [ $i -lt 3 ] && sleep 5
            done
            echo "FAIL $path — status $status — body:"
            echo "$body" | head -5
            exit 1
          }
          smoke /health

      - name: Preview URL
        run: echo "### Preview deployment\n${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
