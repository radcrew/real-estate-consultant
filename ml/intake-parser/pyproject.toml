[project]
name = "consultant-intake-parser"
version = "0.1.0"
description = "Builds and scores the model behind the intake parser — data, training, quantization, eval"
requires-python = ">=3.11"
# Only what the eval and data-generation path needs. The heavy training stack is the
# `train` extra below, so a machine that only scores a GGUF never installs torch.
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Install the CPU torch build explicitly, or pip pulls a CUDA stack this has no use for:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install -e ".[train]"
train = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "huggingface-hub>=0.26.0",
    "sentencepiece>=0.2.0",
    "protobuf>=5.28.0",
    "numpy>=1.26.0",
    "gguf>=0.10.0",
    "peft>=0.13.0",
    "accelerate>=1.0.0",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    # The eval-harness tests build a real `openai.APIStatusError`, which needs an
    # `httpx.Response` to carry the status code. It arrives transitively through `openai`
    # today; declared because a test that imports it should say so, and because the day
    # that SDK changes HTTP client the failure would look like a broken test rather than
    # a missing dependency.
    "httpx>=0.27.0",
]

# `app` is not listed above because PEP 508 has no portable spelling for a relative path
# dependency. It comes from an editable install of the backend, which must be present
# before anything here imports:
#
#   pip install -e ../../backend
#
# That install is the whole reason this package can live outside `backend/`. Prompts come
# from `app.llm.intake.service.build_intake_messages` and decode settings from
# `INTAKE_PARSE_*`, so the harness scores the request production actually sends; editable
# means a backend prompt change lands here on the next run rather than drifting.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# `app` is an installed distribution from here, but it is still this repo's code. Without
# this, isort splits it into the third-party block next to torch and openai, which says the
# backend is a vendor dependency rather than the other half of the same codebase.
known-first-party = ["app", "pipeline"]
